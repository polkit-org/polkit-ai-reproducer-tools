---
name: Build Container Images

on:
  push:
    branches: [main]
    paths:
      - 'environments/**'
  schedule:
    - cron: '0 6 * * 1'  # Weekly Monday 6am UTC
  workflow_dispatch:

permissions:
  packages: write
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        distro: [fedora, ubuntu]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: environments/${{ matrix.distro }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}:${{ matrix.distro }}
            ${{ env.REGISTRY }}/${{ github.repository }}:${{ matrix.distro }}-${{ github.run_number }}
